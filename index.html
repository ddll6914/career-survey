<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나에게 맞는 직업은? | 직업 성향 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #6366F1;
    --accent-light: #EEF2FF;
    --accent-dark: #4F46E5;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-400: #94A3B8;
    --gray-600: #475569;
    --gray-900: #0F172A;
    --white: #FFFFFF;
    --radius: 20px;
    --shadow: 0 4px 32px rgba(99,102,241,0.10);
    --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    background: var(--gray-50);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }

  /* ===== INTRO ===== */
  #screen-intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 480px;
    width: 100%;
    animation: fadeInUp 0.6s ease both;
  }

  .intro-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
    letter-spacing: 0.04em;
  }

  .intro-title {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 800;
    color: var(--gray-900);
    line-height: 1.25;
    margin-bottom: 12px;
  }

  .intro-title span { color: var(--accent); }

  .intro-sub {
    font-size: 15px;
    color: var(--gray-600);
    line-height: 1.7;
    margin-bottom: 32px;
  }

  .btn-start {
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 16px;
    padding: 18px 48px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background var(--transition), transform 0.15s;
    box-shadow: 0 8px 24px rgba(99,102,241,0.30);
    letter-spacing: 0.02em;
  }

  .btn-start:hover { background: var(--accent-dark); transform: translateY(-2px); }
  .btn-start:active { transform: translateY(0); }

  .intro-note {
    margin-top: 20px;
    font-size: 12px;
    color: var(--gray-400);
  }

  /* ===== QUESTION SCREEN ===== */
  #screen-question {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 720px;
  }

  .progress-wrap {
    width: 100%;
    margin-bottom: 20px;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .btn-prev {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: 1.5px solid var(--gray-200);
    color: var(--gray-400);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 0 12px;
    height: 44px;
    border-radius: 100px;
    transition: border-color 0.2s, color 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-prev:hover { border-color: var(--accent); color: var(--accent); }
  .btn-prev:disabled { opacity: 0; pointer-events: none; }

  .progress-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  .progress-fraction {
    font-size: 13px;
    color: var(--gray-400);
    font-weight: 500;
  }

  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: var(--gray-200);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #818CF8);
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  /* Question Card */
  .q-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: 100%;
    overflow: hidden;
    animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
  }

  .q-card-inner {
    display: flex;
    min-height: 300px;
  }

  /* Left panel */
  .q-left {
    flex: 0 0 40%;
    background: var(--gray-50);
    border-right: 2px dashed var(--gray-200);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 16px;
    position: relative;
  }

  .q-icon-box {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .q-icon-box svg {
    width: 64px;
    height: 64px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .q-num-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    background: var(--accent);
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 100px;
    letter-spacing: 0.05em;
  }

  .q-left-text { display: none; }

  /* Right panel */
  .q-right {
    flex: 1;
    padding: 28px 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .q-counter {
    font-size: 12px;
    font-weight: 600;
    color: var(--gray-400);
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }

  .q-text {
    font-size: clamp(15px, 2.5vw, 17px);
    font-weight: 700;
    color: var(--gray-900);
    line-height: 1.6;
    flex: 1;
    display: flex;
    align-items: center;
    padding: 8px 0 20px;
  }

  .q-scale {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .q-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .q-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--gray-200);
    background: var(--white);
    font-size: 15px;
    font-weight: 700;
    color: var(--gray-600);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .q-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
    box-shadow: 0 4px 12px rgba(99,102,241,0.2);
  }

  .q-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--white);
    transform: scale(1.15);
    box-shadow: 0 4px 16px rgba(99,102,241,0.35);
  }

  /* 척도 안내 행 */
  .q-counter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .q-scale-hint {
    font-size: 10px;
    color: var(--gray-400);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ===== RESULT SCREEN ===== */
  #screen-result {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 480px;
    animation: fadeInUp 0.6s ease both;
  }

  /* 결과 히어로 카드 */
  .result-hero {
    width: 100%;
    border-radius: 24px;
    padding: 40px 24px 36px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.18);
  }

  .result-hero::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.10);
    border-radius: 50%;
    pointer-events: none;
  }

  .result-hero::after {
    content: '';
    position: absolute;
    bottom: -70px; left: -50px;
    width: 260px; height: 260px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    pointer-events: none;
  }

  .result-hero-icon {
    display: block;
    width: 140px;
    height: 140px;
    border-radius: 16px;
    object-fit: cover;
    margin: 0 auto 18px;
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }

  .result-hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.22);
    color: rgba(255,255,255,0.95);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 100px;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }

  .result-hero-name {
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 800;
    color: white;
    line-height: 1.25;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .result-hero-desc {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    line-height: 1.65;
    position: relative;
    z-index: 1;
  }

  /* 점수 카드 */
  .result-scores {
    width: 100%;
    background: var(--white);
    border-radius: 20px;
    padding: 22px 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }

  .result-scores-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--gray-400);
    margin-bottom: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
  }

  .score-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-600);
    width: 90px;
    text-align: left;
    flex-shrink: 0;
  }

  .score-bar-bg {
    flex: 1;
    height: 7px;
    background: var(--gray-100);
    border-radius: 100px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1) 0.3s;
  }

  .score-val {
    font-size: 11px;
    font-weight: 700;
    color: var(--gray-400);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }

  .result-cta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }

  .btn-cta-primary {
    color: var(--white);
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }

  .btn-cta-primary:hover { opacity: 0.88; transform: translateY(-2px); }

  .btn-cta-secondary {
    background: var(--white);
    color: var(--gray-600);
    border: 1.5px solid var(--gray-200);
    border-radius: 14px;
    padding: 15px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-cta-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateX(32px) scale(0.97); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes cardOut {
    from { opacity: 1; transform: translateX(0) scale(1); }
    to { opacity: 0; transform: translateX(-32px) scale(0.97); }
  }

  .card-exit { animation: cardOut 0.3s cubic-bezier(0.4,0,0.2,1) both; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 540px) {
    .q-card-inner { flex-direction: column; }
    .q-left {
      flex: none;
      border-right: none;
      border-bottom: 2px dashed var(--gray-200);
      padding: 24px 16px 20px;
      flex-direction: row;
      justify-content: flex-start;
      gap: 14px;
    }
    .q-num-badge { top: 12px; left: 12px; }
    .q-icon-box { width: 56px; height: 56px; }
    .q-icon-box svg { width: 44px; height: 44px; }
    .q-left-text { text-align: left; font-size: 13px; }
    .q-right { padding: 20px 18px 24px; }
    .q-btn { width: 40px; height: 40px; font-size: 14px; }
    .score-name { width: 80px; font-size: 11px; }
  }

  @media (max-width: 375px) {
    .q-buttons { gap: 6px; }
    .q-btn { width: 36px; height: 36px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- ===== INTRO ===== -->
<section id="screen-intro">
  <div class="intro-badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    직업 성향 테스트
  </div>
  <h1 class="intro-title">나에게 딱 맞는<br><span>직업은 무엇일까?</span></h1>
  <p class="intro-sub">15개의 질문에 솔직하게 답하면<br>나의 성향에 꼭 맞는 직업을 알려드려요.</p>
  <button class="btn-start" onclick="startQuiz()">테스트 시작하기 →</button>
  <p class="intro-note">약 3분 소요 · 18문항</p>
</section>

<!-- ===== QUESTION ===== -->
<section id="screen-question">
  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-label" id="prog-label">Q.01</span>
      <span class="progress-fraction" id="prog-fraction">1 / 18</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar" style="width:5.56%"></div>
    </div>
  </div>

  <div class="q-card" id="q-card">
    <div class="q-card-inner">
      <div class="q-left">
        <span class="q-num-badge" id="q-num-badge">01</span>
        <div class="q-icon-box" id="q-icon-box"></div>
        <div class="q-left-text" id="q-left-text"></div>
      </div>
      <div class="q-right">
        <div class="q-counter-row">
          <span class="q-counter" id="q-counter">Q.01 / 18</span>
          <span class="q-scale-hint">[1] 전혀 그렇지 않다 ~ [5] 매우 그렇다 순</span>
        </div>
        <div class="q-text" id="q-text"></div>
        <div class="q-scale">
          <div class="q-buttons" id="q-buttons">
            <button class="btn-prev" id="btn-prev" onclick="goPrev()" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              이전
            </button>
            <button class="q-btn" onclick="selectAnswer(1)">1</button>
            <button class="q-btn" onclick="selectAnswer(2)">2</button>
            <button class="q-btn" onclick="selectAnswer(3)">3</button>
            <button class="q-btn" onclick="selectAnswer(4)">4</button>
            <button class="q-btn" onclick="selectAnswer(5)">5</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== RESULT ===== -->
<section id="screen-result">
  <div class="result-hero" id="result-hero">
    <img class="result-hero-icon" id="result-hero-icon" src="" alt="결과 이미지">
    <div class="result-hero-badge">당신에게 어울리는 직업</div>
    <div class="result-hero-name" id="result-title"></div>
    <div class="result-hero-desc" id="result-desc"></div>
  </div>

  <div class="result-scores" id="result-scores">
    <div class="result-scores-title">직업별 적합도</div>
    <div id="score-bars"></div>
  </div>

  <div class="result-cta">
    <a href="#" class="btn-cta-primary" id="cta-primary">관련 과정 알아보기 →</a>
    <button class="btn-cta-secondary" onclick="restartQuiz()">다시 테스트하기</button>
  </div>
</section>

<script>
// ===== DATA =====
const CAREERS = [
  { name: '시각편집디자이너',   short: '시각편집',   desc: '색과 활자로 메시지를 전달하는 감각파',                         color: '#E91E8C', img: 'images/시각편집.jpg',    ctaLink: 'http://sbsaart.co.kr/edu/eduDtp.asp' },
  { name: '웹디자이너/퍼블리셔', short: '웹디자인',   desc: '화면 설계와 코드를 함께 다루는 디지털 빌더',                   color: '#3B82F6', img: 'images/웹디자인.jpg',    ctaLink: 'http://sbsaart.co.kr/edu/eduUIUX.asp' },
  { name: '제품디자이너',        short: '제품디자인', desc: '쓸모와 아름다움을 동시에 담는 형태의 창조자',                   color: '#10B981', img: 'images/제품.jpg',        ctaLink: 'http://sbsaart.co.kr/eduRenewal/product/productSignature.asp' },
  { name: '인테리어디자이너',    short: '인테리어',   desc: '공간의 분위기를 설계하는 환경 큐레이터',                       color: '#F59E0B', img: 'images/인테리어.jpg',    ctaLink: 'http://sbsaart.co.kr/edu/eduInterior.asp' },
  { name: '모션그래픽디자이너',  short: '모션그래픽', desc: '정지된 디자인에 생명을 불어넣는 동작 연출가',                   color: '#8B5CF6', img: 'images/모션그래픽.png',   ctaLink: 'http://sbsaart.co.kr/edu/eduMaya.asp' },
  { name: 'CG/VFX 디자이너',    short: 'CG/VFX',    desc: '현실 너머의 세계를 픽셀로 구현하는 기술 아티스트',               color: '#EF4444', img: 'images/CG.jpg',           ctaLink: 'http://sbsaart.co.kr/edu/eduCg.asp' },
  { name: '영상편집/크리에이터', short: '영상편집',   desc: '이야기를 영상으로 엮어 감동을 만드는 콘텐츠 제작자',             color: '#F97316', img: 'images/영상편집.jpg',    ctaLink: 'http://sbsaart.co.kr/eduRenewal/motion/youtubeSignature.asp' },
  { name: 'AI크리에이터',        short: 'AI크리에이터', desc: '최신 AI 도구로 새로운 창작 영역을 개척하는 선구자',             color: '#06B6D4', img: 'images/AI크리에이터.jpg', ctaLink: 'http://sbsaart.co.kr/edu/eduAi.asp' },
  { name: '회계사/세무사',       short: '회계/세무',  desc: '숫자 속에서 신뢰를 만드는 재무 전문가',                         color: '#64748B', img: 'images/세무.jpg',        ctaLink: 'http://sbsaart.co.kr/edu/tax/acc_11.asp' },
  { name: '웹툰/만화작가',       short: '웹툰/만화',  desc: '캐릭터와 서사로 세계를 그려내는 이야기꾼',                      color: '#EC4899', img: 'images/웹툰.만화.jpg',   ctaLink: 'http://sbsaart.co.kr/edu/eduDesign.asp' },
];

const QUESTIONS = [
  {
    text: '색이 주는 감정을 이해하고 색을<br>다채롭게 조합하는 것이 즐겁다',
    theme: '팔레트',
    weights: [5,0,0,0,0,0,0,0,0,1],
    icon: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.1 0 2-.9 2-2v-.5c0-.55.45-1 1-1h2c2.76 0 5-2.24 5-5C22 6.48 17.52 2 12 2z"/><circle cx="6.5" cy="11.5" r="1.5"/><circle cx="9.5" cy="7.5" r="1.5"/><circle cx="14.5" cy="7.5" r="1.5"/><circle cx="17.5" cy="11.5" r="1.5"/></svg>`

// ===== STATE =====
let currentQ = 0;
let answers = new Array(18).fill(0);
let isAnimating = false;

// ===== INIT =====
function startQuiz() {
  currentQ = 0;
  answers = new Array(18).fill(0);
  document.getElementById('screen-intro').style.display = 'none';
  const sq = document.getElementById('screen-question');
  sq.style.display = 'flex';
  renderQuestion(currentQ);
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const pct = ((idx + 1) / 18 * 100).toFixed(2);
  const num = String(idx + 1).padStart(2, '0');

  document.getElementById('prog-label').textContent = 'Q.' + num;
  document.getElementById('prog-fraction').textContent = (idx + 1) + ' / 18';
  document.getElementById('progress-bar').style.width = pct + '%';

  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('q-num-badge').textContent = num;
  document.getElementById('q-icon-box').innerHTML = q.icon;
  document.getElementById('q-left-text').textContent = q.theme;
  document.getElementById('q-counter').textContent = 'Q.' + num + ' / 18';
  document.getElementById('q-text').innerHTML = q.text;

  // Reset buttons
  const btns = document.querySelectorAll('.q-btn');
  btns.forEach(b => b.classList.remove('selected'));

  // Restore previous answer if any
  if (answers[idx] > 0) {
    btns[answers[idx] - 1].classList.add('selected');
  }
}

function goPrev() {
  if (isAnimating || currentQ === 0) return;
  isAnimating = true;
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'cardIn 0.35s cubic-bezier(0.4,0,0.2,1) both';
  currentQ--;
  renderQuestion(currentQ);
  isAnimating = false;
}

function selectAnswer(val) {
  if (isAnimating) return;

  answers[currentQ] = val;

  // Highlight selected
  const btns = document.querySelectorAll('.q-btn');
  btns.forEach((b, i) => {
    b.classList.toggle('selected', i + 1 === val);
  });

  isAnimating = true;
  setTimeout(() => {
    if (currentQ < 17) {
      const card = document.getElementById('q-card');
      card.classList.add('card-exit');
      setTimeout(() => {
        card.classList.remove('card-exit');
        currentQ++;
        renderQuestion(currentQ);
        card.style.animation = 'none';
        card.offsetHeight; // reflow
        card.style.animation = '';
        card.style.animation = 'cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both';
        isAnimating = false;
      }, 300);
    } else {
      showResult();
      isAnimating = false;
    }
  }, 350);
}

// ===== SCORE =====
// 정규화 채점: 각 직업의 최대 가능 점수로 나눠 비율 비교
// → 질문 수나 가중치 합이 달라도 공정하게 비교
const MAX_SCORES = CAREERS.map((_, ci) =>
  QUESTIONS.reduce((sum, q) => sum + 5 * q.weights[ci], 0)
);

function calcScores() {
  const raw = new Array(10).fill(0);
  for (let qi = 0; qi < 18; qi++) {
    const val = answers[qi];
    for (let ci = 0; ci < 10; ci++) {
      raw[ci] += val * QUESTIONS[qi].weights[ci];
    }
  }
  // 비율로 반환 (0~1)
  return raw.map((s, i) => MAX_SCORES[i] > 0 ? s / MAX_SCORES[i] : 0);
}

function showResult() {
  // 모든 답이 동일한 숫자면 솔직 경고 화면 표시
  if (answers.every(v => v === answers[0])) {
    document.getElementById('screen-question').style.display = 'none';
    const sr = document.getElementById('screen-result');
    sr.style.display = 'flex';
    document.getElementById('result-hero-icon').style.display = 'none';
    document.getElementById('result-hero').style.background = 'linear-gradient(135deg, #6366F1 0%, #818CF8 100%)';
    document.getElementById('result-hero').querySelector('.result-hero-badge').textContent = '잠깐!';
    document.getElementById('result-title').textContent = '솔직하게 대답해주세요...ㅠㅠ';
    document.getElementById('result-desc').innerHTML = '같은 번호만 선택하면 정확한 결과를 알 수 없어요.<br>다시 한번 솔직하게 답해볼까요?';
    document.getElementById('result-scores').style.display = 'none';
    document.getElementById('cta-primary').style.display = 'none';
    return;
  }

  document.getElementById('result-hero-icon').style.display = '';
  document.getElementById('result-scores').style.display = '';
  document.getElementById('cta-primary').style.display = '';
  document.getElementById('screen-question').style.display = 'none';
  const sr = document.getElementById('screen-result');
  sr.style.display = 'flex';

  const ratios = calcScores(); // 0~1 정규화 비율
  const maxRatio = Math.max(...ratios);
  const winnerIdx = ratios.indexOf(maxRatio);
  const winner = CAREERS[winnerIdx];

  document.getElementById('result-hero-icon').src = winner.img;
  document.getElementById('result-hero').style.background =
    `linear-gradient(135deg, ${winner.color} 0%, ${winner.color}bb 100%)`;
  document.getElementById('result-title').textContent = winner.name;
  document.getElementById('result-desc').textContent = winner.desc;
  document.getElementById('cta-primary').href = winner.ctaLink;
  document.getElementById('cta-primary').target = '_blank';
  document.getElementById('cta-primary').style.background = winner.color;

  // Score bars - 비율(%)로 표시
  const barContainer = document.getElementById('score-bars');
  barContainer.innerHTML = '';

  const indexed = ratios.map((r, i) => ({ r, i })).sort((a, b) => b.r - a.r);

  indexed.forEach(({ r, i }) => {
    const c = CAREERS[i];
    const barPct = Math.round(r / maxRatio * 100); // 바 너비: 1위=100%
    const dispPct = Math.round(r * 100);            // 표시 숫자: 적합도 %
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `
      <div class="score-name">${c.short}</div>
      <div class="score-bar-bg">
        <div class="score-bar-fill" style="width:0%;background:${c.color}" data-pct="${barPct}"></div>
      </div>
      <div class="score-val">${dispPct}%</div>
    `;
    barContainer.appendChild(row);
  });

  // Animate bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.score-bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  });

  sr.style.animation = 'none';
  sr.offsetHeight;
  sr.style.animation = 'fadeInUp 0.6s ease both';
}

function restartQuiz() {
  currentQ = 0;
  answers = new Array(18).fill(0);
  document.getElementById('screen-result').style.display = 'none';
  const si = document.getElementById('screen-intro');
  si.style.display = 'flex';
  si.style.animation = 'none';
  si.offsetHeight;
  si.style.animation = 'fadeInUp 0.6s ease both';
}
</script>
